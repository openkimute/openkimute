# cargo deny check (run by check.sh push and the git pre-push hook): advisories, licenses, bans, sources.
[graph]
all-features = false

[advisories]
ignore = [
    # unmaintained, no replacement in the crates that bring them (nothing known wrong with them):
    { id = "RUSTSEC-2025-0141", reason = "bincode 1: ggrs's message encoding (the rollback packets use it too)" },
    { id = "RUSTSEC-2024-0384", reason = "instant: ggrs's timer" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: egui's font loading (our own embedded fonts only)" },
    { id = "RUSTSEC-2024-0436", reason = "paste: a compile-time macro of rav1e (replays to video); nothing at run time" },
    # a vulnerability with no fix reachable yet: drop when webrtc's dtls takes a crypto-bigint >= 0.7.6
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 (timing leaks): webrtc's DTLS handshake (p256/p384) in online play; no 0.5 fix, dtls needs elliptic-curve 0.13" },
]

[licenses]
# Permissive licenses only (OpenKumite is MIT OR Apache-2.0); CDLA-Permissive-2.0: webpki-roots, the Mozilla CA list (wss);
# NCSA (LLVM's): libfuzzer-sys, which rav1e names for its fuzzing builds only (and fuzz/ uses).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0", "0BSD", "Unlicense", "CDLA-Permissive-2.0", "NCSA"]
confidence-threshold = 0.9

[bans]
# Several versions of one crate come with the graphics and networking stacks (windows-sys, bitflags, ...): noted.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
