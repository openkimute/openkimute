[package]
name = "kumite_render"
description = "wgpu renderer for OpenKumite: skinned characters, stage backdrop and floor"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
glam.workspace = true
bytemuck.workspace = true
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# the window's frames as IOSurfaces on a layer (src/mac_layer.rs); the versions wgpu's Metal backend uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3"

[lints]
workspace = true
