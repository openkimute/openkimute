# The Linux packages (.github/workflows/release.yml): deb, rpm and Arch from the glibc 2.28 build, apk from the
# Alpine (musl) build. nfpm fills ${...} from the environment:
#   VERSION  the release's version, without the v (1.2.3, 1.2.3-rc1)
#   ARCH     amd64 | arm64 (nfpm names it as each format does: x86_64, aarch64, ...)
#   (the binary to package: copied to target/package/openkumite first)
# usage: nfpm package -f packaging/linux/nfpm.yaml -p deb|rpm|archlinux|apk -t OUTDIR
# The converted game data is not packaged (copyrighted): the game finds it in ~/.local/share/openkumite/assets or
# /usr/share/openkumite/assets (README, Assets).
name: openkumite
version: ${VERSION}
version_schema: semver
arch: ${ARCH}
platform: linux
section: games
priority: optional
maintainer: portvex <347037878+portvex@users.noreply.github.com>
description: |
  Open-source 3D fighting game engine.
  Plays game data converted by kumite_converter, 1:1 as the original:
  local versus and online rollback netplay.
vendor: OpenKumite
homepage: https://github.com/openkumite/openkumite
license: MIT

contents:
  - src: target/package/openkumite
    dst: /usr/bin/openkumite
    file_info: { mode: 0755 }
  - src: packaging/linux/openkumite.desktop
    dst: /usr/share/applications/openkumite.desktop
  - src: packaging/openkumite.svg
    dst: /usr/share/icons/hicolor/scalable/apps/openkumite.svg
  - src: README.md
    dst: /usr/share/doc/openkumite/README.md
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/openkumite/THIRD_PARTY_NOTICES.md
  - src: LICENSE-MIT
    dst: /usr/share/licenses/openkumite/LICENSE-MIT

# What the binary links (ALSA for sound, libudev for gamepads); the GPU (Vulkan, else GL) is loaded when it starts,
# so its loader is recommended, not required.
overrides:
  deb:
    # (libasound2t64 first: on Ubuntu 24.04+ / Debian 13+ plain libasound2 is virtual, and apt may take OSS's
    # stand-in for it, which lacks ALSA's versioned symbols)
    depends: [libc6 (>= 2.28), libasound2t64 | libasound2, libudev1]
    recommends: [libvulkan1, mesa-vulkan-drivers]
  rpm:
    # (by library, not package name: Fedora's and openSUSE's names differ)
    depends: ["libasound.so.2()(64bit)", "libudev.so.1()(64bit)"]
    recommends: ["libvulkan.so.1()(64bit)"]
  archlinux:
    depends: [glibc, alsa-lib, systemd-libs]
  apk:
    depends: [so:libasound.so.2, so:libudev.so.1, so:libgcc_s.so.1]
    recommends: [vulkan-loader]

rpm:
  group: Amusements/Games
  summary: Open-source 3D fighting game engine
